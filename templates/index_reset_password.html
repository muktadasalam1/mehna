{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <div class="text-center mb-2">
        <i class="fa-solid fa-key" style="font-size:48px;color:var(--primary);margin-bottom:12px;"></i>
        <h2>إعادة تعيين كلمة المرور</h2>
    </div>
    <form method="POST" id="reset-password-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>كلمة المرور الجديدة</label>
            <div class="password-wrapper">
                <input class="input input-ltr" type="password" name="password" id="reset-password" placeholder="6 أحرف على الأقل" minlength="6" required dir="ltr">
                <button type="button" class="password-toggle" onclick="togglePassword('reset-password',this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <span class="error-msg" id="reset-password-error"></span>
        </div>
        <div class="form-group">
            <label>تأكيد كلمة المرور</label>
            <div class="password-wrapper">
                <input class="input input-ltr" type="password" name="confirm_password" id="reset-confirm-password" placeholder="أعد كتابة كلمة المرور" minlength="6" required dir="ltr">
                <button type="button" class="password-toggle" onclick="togglePassword('reset-confirm-password',this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <span class="error-msg" id="reset-confirm-password-error"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn">تغيير كلمة المرور</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("reset-password-form")?.addEventListener("submit", function () {
    setBtnLoading("reset-submit-btn", "جاري التغيير...");
});
</script>
{% endblock %}
