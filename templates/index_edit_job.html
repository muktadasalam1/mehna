{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="form-card" style="max-width:600px;margin:0 auto;">
        <h2 class="mb-2">تعديل الوظيفة</h2>
        <form action="/jobs/{{ job.id }}/edit" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>العنوان</label>
                <input class="input" type="text" name="title" value="{{ job.title }}" required>
            </div>
            <div class="form-group">
                <label>الراتب</label>
                <input class="input" type="text" name="salary" value="{{ job.salary_range or '' }}">
            </div>
            <div class="form-group">
                <label>الموقع</label>
                <input class="input" type="text" name="location" value="{{ job.location or '' }}" required>
            </div>
            <div class="form-group">
                <label>الدوام</label>
                <div class="select-wrapper">
                    <select class="input" name="job_type">
                        <option value="full_time" {% if job.job_type == 'full_time' %}selected{% endif %}>كامل</option>
                        <option value="part_time" {% if job.job_type == 'part_time' %}selected{% endif %}>جزئي</option>
                        <option value="remote" {% if job.job_type == 'remote' %}selected{% endif %}>عن بعد</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>الوصف</label>
                <textarea class="input" name="description" rows="5" required>{{ job.description or '' }}</textarea>
            </div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">حفظ التعديلات</button>
                <a href="/dashboard" class="btn btn-ghost" style="flex:1;text-align:center;">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
