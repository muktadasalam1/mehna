{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="form-card" style="max-width:600px;">
        <h2>تعديل الشركة</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>اسم الشركة *</label>
                <input class="input" type="text" name="company_name" value="{{ company.name }}" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input class="input input-ltr" type="text" name="phone" dir="ltr">
            </div>
            <div class="form-group">
                <label>المدينة</label>
                <input class="input" type="text" name="location" value="{{ company.location }}" placeholder="بغداد">
            </div>
            <div class="form-group">
                <label>الموقع الإلكتروني</label>
                <input class="input input-ltr" type="url" name="website" value="{{ company.website }}" dir="ltr">
            </div>
            <div class="form-group">
                <label>وصف الشركة</label>
                <textarea class="input" name="description" rows="3">{{ company.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">حفظ التغييرات</button>
        </form>
        <div style="display:flex;gap:8px;margin-top:16px;">
            <a href="/dashboard" class="btn btn-outline btn-block">العودة</a>
            <a href="/companies/delete/{{ company.id }}" class="btn btn-danger btn-block" onclick="return confirm('هل انت متأكد من حذف الشركة؟')">🗑️ حذف الشركة</a>
        </div>
    </div>
</div>
{% endblock %}
