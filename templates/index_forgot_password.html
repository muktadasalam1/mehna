{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <div class="text-center mb-2">
        <i class="fa-solid fa-lock" style="font-size:48px;color:var(--primary);margin-bottom:12px;"></i>
        <h2>نسيت كلمة المرور؟</h2>
        <p class="text-muted" style="margin-top:8px;">أدخل بريدك الإلكتروني وسنرسل لك رابط استعادة كلمة المرور</p>
    </div>
    <form method="POST" id="forgot-password-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input class="input input-ltr" type="email" name="email" id="forgot-email" placeholder="example@email.com" required dir="ltr">
            <span class="error-msg" id="forgot-email-error"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="forgot-submit-btn">
            <i class="fa-solid fa-paper-plane"></i> إرسال
        </button>
    </form>
    <p class="text-center mt-2">
        <a href="/login" style="color:var(--primary);">العودة لتسجيل الدخول</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("forgot-password-form")?.addEventListener("submit", function () {
    setBtnLoading("forgot-submit-btn", "جاري الإرسال...");
});
</script>
{% endblock %}
